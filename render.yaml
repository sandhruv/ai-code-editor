services:
  - type: web
    name: ai-code-editor
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: COMPLETION_MAX_TOKENS
        value: 128
      - key: GROQ_API_KEY
        sync: false
